name: Validate open-source guide
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policy data, consistency, and rebuild
        run: python3 -m unittest discover -s tests -v
      - name: Validate pure finance and compensation arithmetic
        run: node tests/calc.test.js
